name: Infrastructure (Terraform)

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_db_connection_string: ${{ secrets.TF_VAR_DB_CONNECTION_STRING || secrets.DATABASE_URL }}
  TF_VAR_redis_url: ${{ secrets.TF_VAR_REDIS_URL || secrets.REDIS_URL }}
  TF_VAR_resend_api_key: ${{ secrets.TF_VAR_RESEND_API_KEY || secrets.RESEND_API_KEY }}
  TF_VAR_job_secret: ${{ secrets.TF_VAR_JOB_SECRET || secrets.JOB_SECRET }}
  TF_VAR_email_from: ${{ secrets.TF_VAR_EMAIL_FROM || secrets.EMAIL_FROM || 'RailSignal Alerts <alerts@railsignal.co.uk>' }}

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Azure Login via OIDC
        uses: azure/login@v2
        if: env.ARM_CLIENT_ID != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure Resource Providers
        if: env.ARM_CLIENT_ID != ''
        run: |
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait
          az provider register --namespace Microsoft.Insights --wait

      - name: Bootstrap Remote Terraform State
        if: env.ARM_CLIENT_ID != ''
        run: |
          if ! az storage account show --name strailsignaltf --resource-group rg-railsignal-tfstate &>/dev/null; then
            az group create --name rg-railsignal-tfstate --location uksouth
            az storage account create --name strailsignaltf --resource-group rg-railsignal-tfstate --location uksouth --sku Standard_LRS --allow-blob-public-access false --min-tls-version TLS1_2
            az storage container create --name tfstate --account-name strailsignaltf --auth-mode login
          fi

      - name: Terraform Init
        run: terraform init -backend=${{ env.ARM_CLIENT_ID != '' }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: env.ARM_CLIENT_ID != ''
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          echo "### Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request' && env.ARM_CLIENT_ID != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const truncatedPlan = plan.length > 60000 ? plan.substring(0, 60000) + '\n...[truncated]' : plan;
            const body = `#### Terraform Plan Summary 📖\`${{ github.workflow }}\`
            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.ARM_CLIENT_ID != ''
        run: terraform apply -auto-approve tfplan
