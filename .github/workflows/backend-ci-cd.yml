name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - '.github/workflows/backend-ci-cd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate:
    name: Lint, Typecheck & Vitest Suites
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./railsignal.db"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup local database schema
        run: npx prisma db push --schema=backend/prisma/schema.prisma

      - name: Check formatting and linting (Biome)
        run: npm run lint

      - name: Build monorepo dependencies
        run: npm run build:shared && npm run build:backend

      - name: Typecheck
        run: |
          npm run typecheck --workspace=@railsignal/shared
          npm run typecheck --workspace=@railsignal/backend

      - name: Run Vitest unit & integration test suites
        run: npm run test --workspace=@railsignal/backend

  deploy:
    name: Build, Containerize & Deploy to ACA
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lower-cased container image name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login via OIDC
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login via Service Principal Fallback
        if: env.AZURE_CLIENT_ID == '' && env.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        if: env.AZURE_CLIENT_ID != '' || env.AZURE_CREDENTIALS != ''
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ env.IMAGE }}:${{ github.sha }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-railsignal-prod' }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME || 'railsignal-api' }}
          containerAppEnvironment: ${{ vars.AZURE_CONTAINER_APP_ENV || 'cae-railsignal-prod' }}
          targetPort: 3000
          ingress: external
